version: '3'

env:
  BIN_DIR: ./bin

vars:
  APP_NAME: investor
  GO_VERSION: '1.24'
  GOLANGCI_LINT_VERSION: 'v2.1.5'
  GCI_VERSION: 'v0.13.6'
  GOFUMPT_VERSION: 'v0.8.0'
  BUF_VERSION: '1.53.0'
  PROTOC_GEN_GO_VERSION: 'v1.36.6'
  PROTOC_GEN_GO_GRPC_VERSION: 'v1.5.1'
  GRPCURL_VERSION: 'v1.9.3'
  ENVSUBST_VERSION: 'v1.4.3'

  BIN_DIR: '{{.ROOT_DIR}}/bin'
  GOLANGCI_LINT: '{{.BIN_DIR}}/golangci-lint'
  GCI: '{{.BIN_DIR}}/gci'
  GOFUMPT: '{{.BIN_DIR}}/gofumpt'
  BUF: '{{.BIN_DIR}}/buf'
  PROTOC_GEN_GO: '{{.BIN_DIR}}/protoc-gen-go'
  PROTOC_GEN_GO_GRPC: '{{.BIN_DIR}}/protoc-gen-go-grpc'
  GRPCURL: '{{.BIN_DIR}}/grpcurl'
  ENVSUBST: '{{.BIN_DIR}}/envsubst'
  ENVDIR: '{{.ROOT_DIR}}/deploy/env'

  MODULES: investor platform

tasks:
  install-formatters:
    desc: "Устанавливает форматтеры gci и gofumpt в ./bin"
    cmds:
      - |
        [ -f {{.GOFUMPT}} ] || {
          echo '📦 Устанавливаем gofumpt {{.GOFUMPT_VERSION}}...'
          GOBIN={{.BIN_DIR}} go install mvdan.cc/gofumpt@{{.GOFUMPT_VERSION}}
        }
        [ -f {{.GCI}} ] || {
          echo '📦 Устанавливаем gci {{.GCI_VERSION}}...'
          GOBIN={{.BIN_DIR}} go install github.com/daixiang0/gci@{{.GCI_VERSION}}
        }
    status:
      - test -x {{.GOFUMPT}}
      - test -x {{.GCI}}

  format:
    desc: "Форматирует весь проект gofumpt + gci, исключая mocks"
    deps: [ install-formatters ]
    cmds:
      - |
        echo "🧼 Форматируем через gofumpt ..."
        
        for module in {{.MODULES}}; do
          if [ -d "$module" ]; then
            echo "🧼 Форматируем $module"
            find $module -type f -name '*.go' ! -path '*/mocks/*' -exec {{.GOFUMPT}} -extra -w {} +
          fi
        done
      - |
        echo "🎯 Сортируем импорты через gci ..."
        
        for module in {{.MODULES}}; do
          if [ -d "$module" ]; then
            echo "🎯 Сортируем импорты в $module"
            find $module -type f -name '*.go' ! -path '*/mocks/*' -exec {{.GCI}} write -s standard -s default -s "prefix(github.com/alekparkhomenko/investor/)" {} +
          fi
        done

  install-golangci-lint:
    desc: "Устанавливает golangci-lint в каталог bin"
    cmds:
      - |
        [ -f {{.GOLANGCI_LINT}} ] || {
          mkdir -p {{.BIN_DIR}}
          echo "📦 Устанавливаем golangci-lint {{.GOLANGCI_LINT_VERSION}}..."
          GOBIN={{.BIN_DIR}} go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
        }
    status:
      - test -x {{.GOLANGCI_LINT}}

  lint:
    desc: "Запускает golangci-lint для всех модулей"
    deps: [ install-golangci-lint ]
    vars:
      MODULES: '{{.MODULES}}'
      GOLANGCI_LINT: '{{.GOLANGCI_LINT}}'
    cmds:
      - |
        set -e
        ERR=0
        echo "🔍 Линтим все модули ..."
        for mod in {{.MODULES}}; do
          if [ -d "$mod" ]; then
            echo "🔍 Линтим $mod module"
            {{.GOLANGCI_LINT}} run $mod/... --config=.golangci.yml || ERR=1
          fi
        done
        exit $ERR

  deps:update:
    desc: "Обновление зависимостей в go.mod во всех модулях"
    cmds:
      - |
        echo "🔄 Обновление зависимостей в go.work"
        go work sync
        echo "🔄 Обновление зависимостей в go.mod во всех модулях"
        for mod in {{.MODULES}}; do
          if [ -d "$mod" ]; then
            echo "🔄 Обновление зависимостей в $mod"
            (cd "$mod" && go mod tidy -compat=1.24) || exit 1
          fi
        done

  run:
    desc: "Запускает investor локально"
    cmds:
      - |
        echo "🚀 Запускаем investor..."
        go run ./investor/cmd/main.go

  docker:build:
    desc: "Собирает Docker образ"
    cmds:
      - |
        echo "🐳 Собираем Docker образ..."
        docker build -t investor:latest -f investor/Dockerfile ../..

  docker:up:
    desc: "Запускает проект (app + loki)"
    cmds:
      - |
        echo "🐳 Запускаем app + postgres..."
        docker compose -f deploy/app/docker-compose.yml up -d --build
        echo "🐳 Запускаем loki stack..."
        docker compose -f deploy/loki/docker-compose.yml up -d
        echo "✅ Все сервисы запущены"
        echo "📊 App: http://localhost:8080"
        echo "📊 Swagger: http://localhost:8080/swagger"
        echo "📊 Grafana: http://localhost:3000 (admin/admin)"

  docker:down:
    desc: "Останавливает все сервисы"
    cmds:
      - |
        echo "🐳 Останавливаем app..."
        docker compose -f deploy/app/docker-compose.yml down
        echo "🐳 Останавливаем loki stack..."
        docker compose -f deploy/loki/docker-compose.yml down
        echo "✅ Все сервисы остановлены"

  docker:restart:
    desc: "Перезапускает все сервисы"
    cmds:
      - |
        echo "🔄 Перезапускаем..."
        docker compose -f deploy/app/docker-compose.yml down
        docker compose -f deploy/loki/docker-compose.yml down
        docker compose -f deploy/loki/docker-compose.yml up -d
        docker compose -f deploy/app/docker-compose.yml up -d --build
        echo "✅ Все сервисы перезапущены"

  docker:logs:
    desc: "Показывает логи docker-compose"
    cmds:
      - docker compose -f deploy/app/docker-compose.yml logs -f

  # =============================================================================
  # Loki Stack Management
  # =============================================================================

  loki:up:
    desc: "Запуск Loki stack (loki, promtail, grafana)"
    aliases: [ loki:start ]
    cmds:
      - |
        echo "🚀 Запуск Loki stack..."
        docker compose -f deploy/loki/docker-compose.yml up -d
        echo "✅ Loki stack запущен"
        echo "📊 Grafana: http://localhost:3000 (admin/admin)"
        echo "📝 Loki: http://localhost:3100"

  loki:down:
    desc: "Остановка Loki stack"
    aliases: [ loki:stop ]
    cmds:
      - |
        echo "🛑 Остановка Loki stack..."
        docker compose -f deploy/loki/docker-compose.yml down
        echo "✅ Loki stack остановлен"

  loki:logs:
    desc: "Просмотр логов всех сервисов Loki stack"
    aliases: [ loki:log ]
    deps: [ loki:up ]
    cmds:
      - |
        echo "📋 Логи Loki stack..."
        docker compose -f deploy/loki/docker-compose.yml logs -f

  loki:status:
    desc: "Статус сервисов Loki stack"
    aliases: [ loki:ps ]
    cmds:
      - |
        echo "📊 Статус сервисов Loki stack..."
        docker compose -f deploy/loki/docker-compose.yml ps

  loki:validate:
    desc: "Валидация конфигурации Loki stack"
    aliases: [ loki:config, loki:check ]
    cmds:
      - |
        echo "🔍 Валидация конфигурации Loki stack..."
        docker compose -f deploy/loki/docker-compose.yml config

  loki:prune:
    desc: "Очистка Loki stack (удаление volumes)"
    aliases: [ loki:clean ]
    cmds:
      - |
        echo "🧹 Очистка Loki stack (удаление volumes)..."
        docker compose -f deploy/loki/docker-compose.yml down -v
        echo "✅ Loki stack очищен"

  # =============================================================================
  # Database Management
  # =============================================================================

  db:up:
    desc: "Запуск PostgreSQL"
    cmds:
      - |
        echo "🚀 Запуск PostgreSQL..."
        docker compose -f deploy/postgres/docker-compose.yml up -d
        echo "✅ PostgreSQL запущен"

  db:down:
    desc: "Остановка PostgreSQL"
    cmds:
      - |
        echo "🛑 Остановка PostgreSQL..."
        docker compose -f deploy/postgres/docker-compose.yml down
        echo "✅ PostgreSQL остановлен"

  db:migrate:apply:
    desc: "Применение миграций базы данных"
    cmds:
      - |
        echo "🗄️ Применяем миграции..."
        PGPASSWORD=investor psql -h localhost -U investor -d investor -f investor/migrations/001_portfolio.up.sql
        echo "✅ Миграции применены"

  db:migrate:rollback:
    desc: "Откат миграций базы данных"
    cmds:
      - |
        echo "↩️ Откатываем миграции..."
        PGPASSWORD=investor psql -h localhost -U investor -d investor -f investor/migrations/001_portfolio.down.sql
        echo "✅ Миграции откачены"

  db:seed:
    desc: "Заполнение базы данных тестовыми данными"
    deps: [ db:migrate:apply ]
    cmds:
      - |
        echo "🌱 Данные уже в миграции (1_portfolio.up.sql)"
        echo "✅ Seed data Ready"

  db:psql:
    desc: "Подключение к PostgreSQL через psql"
    cmds:
      - PGPASSWORD=investor psql -h localhost -U investor -d investor

  # =============================================================================
  # Portfolio API
  # =============================================================================

  api:up:
    desc: "Запуск Portfolio API сервера"
    cmds:
      - |
        echo "🚀 Запускаем Portfolio API..."
        cd investor && go run cmd/main.go

  api:swagger:
    desc: "Открыть Swagger UI в браузере"
    cmds:
      - open http://localhost:8080/swagger/index.html

  api:test:
    desc: "Тестирование API endpoint'ов"
    cmds:
      - |
        echo "🧪 Тестируем API..."
        echo "📋 GET /api/v1/tickers"
        curl -s http://localhost:8080/api/v1/tickers | head -c 500
        echo ""
        echo "📋 GET /api/v1/portfolio"
        curl -s http://localhost:8080/api/v1/portfolio
        echo ""
