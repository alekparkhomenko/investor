version: '3.9'

services:
  postgres:
    image: postgres:17-alpine
    container_name: investor-postgres
    environment:
      POSTGRES_USER: investor
      POSTGRES_PASSWORD: investor
      POSTGRES_DB: investor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investor"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: