version: '3.9'

services:
  investor:
    build:
      context: ../..
      dockerfile: investor/Dockerfile
    env_file:
      - ../../.env
    ports:
      - "8080:8080"
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - HTTP_HOST=0.0.0.0
      - DATABASE_URL=postgres://investor:investor@postgres:5432/investor?sslmode=disable
    depends_on:
      - postgres
    networks:
      - app_network
    restart: on-failure

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: investor
      POSTGRES_PASSWORD: investor
      POSTGRES_DB: investor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investor"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network
    restart: on-failure

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
