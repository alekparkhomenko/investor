apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      derivedFields:
        - matcherRegex: "duration_ms=(\\d+)"
          name: Duration
          url: "$${__value.raw}"
          datasourceUid: ""
