apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      derivedFields:
        - datasourceUid: prometheus
          matcherRegex: "duration_ms=(\\d+)"
          name: Duration
          url: "$${__value.raw}"
