server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Логи из Docker контейнеров
  - job_name: containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: container-logs
          __path__: /var/lib/docker/containers/*/*log

    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs:
      - json:
          expressions:
            tag:
          source: attrs
      - regex:
          expression: (?P<container_name>(?:[a-zA-Z0-9][a-zA-Z0-9_.-]+)?)
          source: tag
      - labeldrop:
          - filename
      - labels:
          container_name:
      - output:
          source: output

  # Логи приложения investor (если запускается не в Docker)
  - job_name: investor-app
    static_configs:
      - targets:
          - localhost
        labels:
          job: investor
          app: investor
          __path__: /var/log/investor/*.log

  # Системные логи
  - job_name: syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          __path__: /var/log/*.log
